[project]
name = "onestream-testing"
version = "0.1.0"
description = "Test execution engine for OneStream IDE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "deepeval>=0.21.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
