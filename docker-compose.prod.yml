version: "3.9"

services:
  # ── Application Services ──
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/api-gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:8080
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: infrastructure/docker/orchestrator/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  roslyn-service:
    build:
      context: .
      dockerfile: packages/roslyn-service/Dockerfile
    ports:
      - "5100:5100"

  knowledge:
    build:
      context: .
      dockerfile: infrastructure/docker/knowledge/Dockerfile
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  testing:
    build:
      context: .
      dockerfile: infrastructure/docker/testing/Dockerfile
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      ROSLYN_URL: http://roslyn-service:5100
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  alm:
    build:
      context: .
      dockerfile: infrastructure/docker/alm/Dockerfile
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      OPA_ENDPOINT: http://opa:8181
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  data-orchestration:
    build:
      context: .
      dockerfile: infrastructure/docker/data-orchestration/Dockerfile
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/onestream_ide
      RABBITMQ_URL: amqp://ide_agent:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Infrastructure ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: onestream_ide
      POSTGRES_USER: ide_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ide_agent -d onestream_ide"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ide_agent
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  eventstoredb:
    image: eventstore/eventstore:latest
    environment:
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_RUN_PROJECTIONS: All
    ports:
      - "2113:2113"
    volumes:
      - eventstore_data:/var/lib/eventstore

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"

  langfuse:
    image: langfuse/langfuse:latest
    environment:
      DATABASE_URL: postgresql://ide_agent:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      NEXTAUTH_URL: http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  eventstore_data:
